# Vendored copy of the wasm2c runtime from WABT. tools/vendor.py and
# third_party/README.md describe this file.

url = "https://github.com/WebAssembly/wabt"
# A commit on WABT's main branch, 32 commits after the 1.0.42 tag
# (git describe: 1.0.42-32-gbda86b8). WABT still reports version 1.0.42.
commit = "bda86b81e5b8dfcf75a4a5c1f7ad99c54254223f"
version = "1.0.42"
license_file = "LICENSE"
patches = []

# Upstream path = local path, relative to this directory.
[files]
"wasm2c/wasm-rt.h" = "wasm-rt.h"
"wasm2c/wasm-rt-impl.c" = "wasm-rt-impl.c"
"wasm2c/wasm-rt-impl.h" = "wasm-rt-impl.h"
"wasm2c/wasm-rt-impl-tableops.inc" = "wasm-rt-impl-tableops.inc"
"wasm2c/wasm-rt-mem-impl.c" = "wasm-rt-mem-impl.c"
"wasm2c/wasm-rt-mem-impl-helper.inc" = "wasm-rt-mem-impl-helper.inc"
"wasm2c/wasm-rt-exceptions.h" = "wasm-rt-exceptions.h"
"wasm2c/wasm-rt-exceptions-impl.c" = "wasm-rt-exceptions-impl.c"
"LICENSE" = "LICENSE"

# version must be the version WABT declares at the pinned commit.
[version_check]
upstream_file = "CMakeLists.txt"
regex = '^project\(WABT LANGUAGES C CXX VERSION ([0-9.]+)\)'

# x86sandbox/generated/ is wasm2c output. It must come from the same WABT
# commit as this runtime; regenerate.sh builds wasm2c from that commit and
# records it here.
[[stamps]]
file = "x86sandbox/generated/README.txt"
line = "wasm2c: {version}, built from WABT {commit}"

[doc]
title = "wasm2c runtime (WABT)"
summary = "Runtime support for C code generated by wasm2c, used by the x86 sandbox."
notes = "The commit is on WABT's main branch, 32 commits after the 1.0.42 tag; WABT reports its version as 1.0.42 there. It has the table allocator fix for CVE-2026-90648, which the 1.0.42 release does not. The C code in x86sandbox/generated/ is produced by a wasm2c that x86sandbox/regenerate.sh builds from this commit, and x86sandbox/generated/README.txt records the commit."
license = "The wasm2c runtime is licensed under the Apache License, Version 2.0."
