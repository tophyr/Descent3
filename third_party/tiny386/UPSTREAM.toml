[doc]
title = "tiny386"
summary = "i386 CPU and x87 FPU emulator used by the x86 sandbox (x86sandbox/)."
notes = "x86sandbox/regenerate.sh compiles these files into the guest, so x86sandbox/generated/ must be regenerated after they change."
