# Upstream path = local path, relative to this directory.
[files]
"fpu.c" = "fpu.c"
"fpu.h" = "fpu.h"
"i386.c" = "i386.c"
"i386.h" = "i386.h"
"i386ins.def" = "i386ins.def"
"simd.inc" = "simd.inc"
