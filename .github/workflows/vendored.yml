name: Vendored Code Check


on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main


jobs:

  check:
    name: Compare vendored code with upstream
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends git python3 ca-certificates

      - name: Check vendored code
        run: python3 tools/vendor.py check
