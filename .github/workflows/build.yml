name: Descent 3 Build


on:
  workflow_call:
    secrets:
      MACOS_SIGNING_IDENTITY:
        required: false
      MACOS_SIGNING_CERTIFICATE_P12:
        required: false
      MACOS_SIGNING_CERTIFICATE_P12_PASSWORD:
        required: false
      MACOS_APP_STORE_CONNECT_KEY:
        required: false
      MACOS_APP_STORE_CONNECT_KEY_ID:
        required: false
      MACOS_APP_STORE_CONNECT_ISSUER_ID:
        required: false


jobs:

  build:
    name: ${{ matrix.os.name }}, ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - runner: windows-2025-vs2026
            preset: win
            cc: cl
            cxx: cl
            name: Windows-x64
          - runner: macos-15  # Apple Silicon, but we make a universal binary
            preset: mac
            cc: cc
            cxx: c++
            name: macOS
          - runner: ubuntu-26.04
            preset: linux
            cc: gcc
            cxx: g++
            name: Linux-x64
          - runner: ubuntu-26.04
            preset: linux-cross-arm64
            cc: gcc
            cxx: g++
            name: Linux-cross-arm64
        build_type:
          - Debug
          - Release

    runs-on: ${{ matrix.os.runner }}

    env:
      # Debug builds use the mock clock. They are only built and tested, never installed, signed or uploaded.
      MOCK_CLOCK: ${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
      MACOS_AND_CODE_SIGNING: ${{ matrix.os.preset == 'mac' && matrix.build_type != 'Debug' && secrets.MACOS_SIGNING_IDENTITY != '' }}
      # vcpkg stores the packages it builds in vcpkg-binary-cache, which is saved with actions/cache.
      # Setting this also stops run-vcpkg from selecting the x-gha backend, which vcpkg has removed.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS Rosetta 2
        if: ${{ matrix.os.preset == 'mac' }}
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license

      - name: Install macOS dependencies
        if: ${{ matrix.os.preset == 'mac' }}
        run: brew bundle install

      # The Ubuntu mirror the runners use sometimes serves packages at about 35 kB/s, which turns a
      # 3 second download into 8 minutes. Downloaded packages are kept in apt-archives and cached, so
      # a cache hit downloads only the package index.
      - name: Restore apt package cache
        id: apt-cache
        if: ${{ startsWith(matrix.os.runner, 'ubuntu-') }}
        uses: actions/cache/restore@v6
        with:
          path: apt-archives/*.deb
          key: apt-${{ matrix.os.runner }}-${{ matrix.os.preset }}
          restore-keys: apt-${{ matrix.os.runner }}-${{ matrix.os.preset }}-

      - name: Install Linux dependencies
        if: ${{ startsWith(matrix.os.runner, 'ubuntu-') }}
        run: |
          sudo apt-get update
          sudo apt-get install -o Dir::Cache::Archives="$PWD/apt-archives" -y --no-install-recommends \
            ninja-build g++ python3 curl pkg-config autoconf autoconf-archive automake libtool libltdl-dev make python3-jinja2 libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libibus-1.0-dev libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev libxss-dev

      - name: Setup cmake
        if: ${{ startsWith(matrix.os.runner, 'ubuntu-') }}
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.x'


      - name: Install Linux Cross-compilation dependencies
        if: ${{ matrix.os.preset == 'linux-cross-arm64' }}
        run: |
          sudo apt-get install -o Dir::Cache::Archives="$PWD/apt-archives" -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu g++-aarch64-linux-gnu

      # autoclean deletes packages that the current index no longer offers, so superseded versions
      # do not pile up in the cache. apt leaves a lock file and a partial/ directory that only root
      # can read, which would make the cache save fail.
      - name: Prune apt package cache
        if: ${{ startsWith(matrix.os.runner, 'ubuntu-') }}
        run: |
          sudo apt-get -o Dir::Cache::Archives="$PWD/apt-archives" autoclean
          sudo rm -rf apt-archives/partial apt-archives/lock

      - name: Save apt package cache
        if: ${{ startsWith(matrix.os.runner, 'ubuntu-') && hashFiles('apt-archives/*.deb') != '' && steps.apt-cache.outputs.cache-matched-key != format('apt-{0}-{1}-{2}', matrix.os.runner, matrix.os.preset, hashFiles('apt-archives/*.deb')) }}
        uses: actions/cache/save@v6
        with:
          path: apt-archives/*.deb
          key: apt-${{ matrix.os.runner }}-${{ matrix.os.preset }}-${{ hashFiles('apt-archives/*.deb') }}

      - name: Install Windows dependencies
        if: ${{ startsWith(matrix.os.runner, 'windows-') }}
        run: choco install ninja

      - uses: ilammy/msvc-dev-cmd@v1
        if: ${{ startsWith(matrix.os.runner, 'windows-') }}
        with:
           arch: win64

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      # The key never matches exactly, so this restores the most recent cache for the preset. The
      # Debug and Release jobs build the same packages and share it.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ matrix.os.preset }}
          restore-keys: vcpkg-${{ matrix.os.preset }}-

      - name: Configure cross-compiled build
        if: ${{ matrix.os.preset == 'linux-cross-arm64' }}
        run: |
          cmake --preset linux
          ninja -f build-${{ matrix.build_type }}.ninja -C builds/linux/ HogMaker
          cmake --preset linux-cross-arm64 -DHogMaker_DIR=$PWD/builds/linux/ -DENABLE_MOCK_CLOCK=${{ env.MOCK_CLOCK }} -DBUILD_TESTING=OFF -DENABLE_LOGGER=ON -DFORCE_PORTABLE_INSTALL=ON -DBUILD_EDITOR=OFF -DUSE_EXTERNAL_PLOG=ON

      - name: Customize vcpkg to create macOS universal binary
        if: ${{ matrix.os.preset == 'mac' }}
        working-directory: ${{ env.VCPKG_ROOT }}/triplets
        run: |
          cp ./arm64-osx.cmake ./community/universal-osx.cmake
          sed -i '' 's/^set(VCPKG_OSX_ARCHITECTURES.*$/set(VCPKG_OSX_ARCHITECTURES "arm64;x86_64")/' ./community/universal-osx.cmake

      - name: Import macOS code signing certificate
        if: ${{ env.MACOS_AND_CODE_SIGNING == 'true' }}
        uses: DescentDevelopers/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12_PASSWORD }}

      - name: Configure CMake
        if: ${{ matrix.os.preset != 'linux-cross-arm64' }}
        env:
          CC: ${{ matrix.os.cc }}
          CXX: ${{ matrix.os.cxx }}
        # Only pass the signing identity when the certificate was imported above, otherwise the post-build codesign calls fail.
        run: cmake --preset ${{ matrix.os.preset }} -DCODESIGN_IDENTITY=${{ env.MACOS_AND_CODE_SIGNING == 'true' && secrets.MACOS_SIGNING_IDENTITY || '' }} -DENABLE_MOCK_CLOCK=${{ env.MOCK_CLOCK }} -DBUILD_TESTING=ON -DENABLE_LOGGER=ON -DFORCE_PORTABLE_INSTALL=ON -DBUILD_EDITOR=ON -DUSE_EXTERNAL_PLOG=ON

      # Deletes archives that no installed package uses, so the cache does not keep growing as
      # compilers and ports change. Only runs after a successful configure: after a failure some
      # packages are not installed yet, and their archives would be deleted.
      - name: Prune vcpkg binary cache
        run: cmake -DCACHE_DIR=vcpkg-binary-cache -DBUILD_ROOT=builds -P .github/prune-vcpkg-cache.cmake

      # Archive names are vcpkg ABI hashes, so the directory only changes when vcpkg built something
      # it could not restore. Saving runs after a failed configure too, to keep the packages that did
      # build.
      - name: Save vcpkg binary cache
        if: ${{ !cancelled() && hashFiles('vcpkg-binary-cache/**') != '' && steps.vcpkg-cache.outputs.cache-matched-key != format('vcpkg-{0}-{1}', matrix.os.preset, hashFiles('vcpkg-binary-cache/**')) }}
        uses: actions/cache/save@v6
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ matrix.os.preset }}-${{ hashFiles('vcpkg-binary-cache/**') }}

      - name: Build ${{ matrix.build_type }}
        run: cmake --build --preset ${{ matrix.os.preset }} --config ${{ matrix.build_type }} --verbose

      - name: Run ${{ matrix.build_type }} Unittests
        if: ${{ matrix.os.preset != 'linux-cross-arm64' }}
        run: ctest --preset ${{ matrix.os.preset }} -C ${{ matrix.build_type }}

      - name: Local install
        if: ${{ matrix.build_type != 'Debug' }}
        # There no cmake install presets so install in traditional way
        run: cmake --install builds/${{ matrix.os.preset }}/ --config ${{ matrix.build_type }}

      - name: Sign, package, and notarize for macOS
        if: ${{ env.MACOS_AND_CODE_SIGNING == 'true' }}
        uses: DescentDevelopers/macos-sign-package-notarize@82f8d21e2eeb0db1ee824ee9f52a8a7c09a9e94e # v2
        with:
          path-to-binaries: builds/${{ matrix.os.preset }}/installed/Descent3.app builds/${{ matrix.os.preset }}/installed/netgames/*
          signing-identity: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          app-store-connect-key: ${{ secrets.MACOS_APP_STORE_CONNECT_KEY }}
          app-store-connect-key-id: ${{ secrets.MACOS_APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.MACOS_APP_STORE_CONNECT_ISSUER_ID }}
          archive-files: builds/${{ matrix.os.preset }}/installed/*
          archive-disk-name: Descent 3
          archive-file-path: builds/${{ matrix.os.preset }}/Descent3-${{ matrix.build_type }}-${{ matrix.os.name }}.dmg

      - name: Swap macOS DMG disk image into installed folder
        if: ${{ env.MACOS_AND_CODE_SIGNING == 'true' }}
        run: |
          rm -rf builds/${{ matrix.os.preset }}/installed/*
          mv builds/${{ matrix.os.preset }}/Descent3-${{ matrix.build_type }}-${{ matrix.os.name }}.dmg builds/${{ matrix.os.preset }}/installed/

      - name: Upload Artifacts
        if: ${{ matrix.build_type != 'Debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: Descent3_${{ matrix.build_type }}_${{ matrix.os.name }}
          path: ${{ github.workspace }}/builds/${{ matrix.os.preset }}/installed/
